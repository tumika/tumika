# golangci-lint configuration (v2 schema).
#
# Note: in golangci-lint v2 the old `gosimple` linter was merged into
# `staticcheck`, so enabling `staticcheck` covers the gosimple checks too.
#
# `depguard` is the load-bearing linter here. It is the mechanical enforcement
# of the layering rules documented in .agents/rules/ and ADR-0004: a forbidden
# import is a red build rather than a review argument. When a layering rule
# changes, this file and the corresponding rule file change in the same commit.
version: "2"

linters:
  enable:
    - depguard
    - errcheck
    - govet
    - staticcheck
    - unused

  settings:
    depguard:
      rules:
        # LAYER 1 — API is transport only: decode, call one service method,
        # encode. It never reaches the database.
        # See .agents/rules/all-business-logic-lives-in-the-service-layer.md
        api:
          files:
            - "**/source/internal/api/**"
          deny:
            - pkg: github.com/tumika/tumika/source/internal/repository
              desc: >-
                API is transport only. Handlers call exactly one service method;
                business logic and data access belong in the service layer.

        # CLI — an HTTP client of the daemon, not a second entry point.
        #
        # `daemon` is permitted: `tumika token` and `tumika install` have to work
        # before a daemon is running, and on a fresh install there is no token to
        # authenticate an HTTP call with. Everything else goes over the API, so
        # that one set of business rules serves both a local and a remote daemon
        # (ADR-0004).
        cli:
          files:
            - "**/source/internal/cli/**"
          deny:
            - pkg: github.com/tumika/tumika/source/internal/repository
              desc: >-
                The CLI must not reach the database. Commands that need daemon
                state call the API; the two that run before a daemon exists go
                through the daemon package's composition root.
            - pkg: github.com/tumika/tumika/source/internal/api
              desc: >-
                The CLI is a CLIENT of the HTTP API, not a caller of its
                handlers.

        # LAYER 2 — services own business logic, and depend on repository
        # INTERFACES rather than on whichever database implements them.
        service:
          files:
            - "**/source/internal/service/**"
          deny:
            - pkg: github.com/tumika/tumika/source/internal/repository/sqlite
              desc: >-
                A service takes the repository interfaces it owns; only daemon,
                the composition root, knows which implementation is behind them.
                This is what lets business logic be tested against in-memory
                fakes with no database — the payoff the layering exists for.
            - pkg: github.com/tumika/tumika/source/internal/api
              desc: >-
                A service must not know about transport.

        # LAYER 3 — repositories are data access. They know nothing about the
        # callers above them.
        repository:
          files:
            - "**/source/internal/repository/**"
          deny:
            - pkg: github.com/tumika/tumika/source/internal/service
              desc: >-
                A repository must not call a service. Data access returns domain
                types; business logic lives above it.
            - pkg: github.com/tumika/tumika/source/internal/api
              desc: >-
                A repository must not know about transport.
            - pkg: github.com/tumika/tumika/source/internal/runner
              desc: >-
                A repository must not know about its callers.

        # RUNNER — supervised long-lived processes depend on services only.
        # See .agents/rules/runners-depend-on-services-never-repositories.md
        runner:
          files:
            - "**/source/internal/runner/**"
          deny:
            - pkg: github.com/tumika/tumika/source/internal/repository
              desc: >-
                A runner supplies the schedule, not the query. Call the owning
                service (UpdateService, ProviderService) instead.
            - pkg: github.com/tumika/tumika/source/internal/api
              desc: >-
                A runner is a caller of services, not of transport.

        # PLATFORM — infrastructure abstractions. Services depend on platform
        # interfaces; implementations are injected in daemon, the composition
        # root. The dependency never points the other way.
        platform:
          files:
            - "**/source/internal/platform/**"
          deny:
            - pkg: github.com/tumika/tumika/source/internal/service
              desc: >-
                Platform is infrastructure. Services depend on platform
                interfaces, never the reverse.
            - pkg: github.com/tumika/tumika/source/internal/repository
              desc: >-
                Platform must not read or write application state.
            - pkg: github.com/tumika/tumika/source/internal/api
              desc: >-
                Platform must not know about transport.
            - pkg: github.com/tumika/tumika/source/internal/runner
              desc: >-
                Platform must not know about its callers.

        # DOMAIN — shared types. Every layer may import it; it imports nothing
        # of ours, which is what keeps it importable from everywhere without
        # creating a cycle.
        # DOMAIN — shared types. Every layer may import it; it imports nothing
        # but the standard library and itself, which is what keeps it importable
        # from everywhere without creating a cycle.
        #
        # Expressed as an allowlist rather than a deny on the
        # `.../source/internal` prefix. That prefix is also a prefix of
        # `.../source/internal/domain/...`, so the deny form fired on domain's
        # own subpackages with a message describing a rule they were not
        # breaking — and depguard does not let `allow` override `deny`. The
        # allowlist has no such blind spot, and is stricter: it also keeps
        # third-party dependencies out of domain, which a deny on our own prefix
        # never did.
        domain:
          files:
            - "**/source/internal/domain/**"
          allow:
            - $gostd
            - github.com/tumika/tumika/source/internal/domain

        # No cgo, anywhere. Every build is CGO_ENABLED=0 so cross-compiling for
        # linux/arm64 is free — which is also why the SQLite driver is the pure
        # Go modernc.org/sqlite.
        #
        # This rule does NOT enforce that, and cannot: depguard never sees
        # `import "C"`. Under CGO_ENABLED=1 the analysis runs on the
        # cgo-rewritten file, and under CGO_ENABLED=0 build constraints exclude
        # the file entirely, so the linter reports 0 issues either way. It is
        # kept as documentation of intent.
        #
        # The actual enforcement is the `no cgo` step of the `cross-compile` job
        # in ci.yml, which fails when `go list` reports a non-empty CgoFiles.
        # Note that `CGO_ENABLED=0 go build ./...` does NOT catch it either:
        # build constraints exclude the file, the pattern match skips the
        # package, and the build exits zero.
        nocgo:
          files:
            - "$all"
          deny:
            - pkg: "C"
              desc: >-
                tumika builds with CGO_ENABLED=0 so its binaries are statically
                linked and cross-compile for linux/arm64. Do not introduce cgo.
