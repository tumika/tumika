# Codecov reports coverage; `bulwark coverage` is the gate that blocks a merge
# (see .github/workflows/ci.yml). This file exists so the two agree about WHAT
# is worth measuring, rather than to loosen either.
#
# Everything ignored below is code no test should be asked to cover:

ignore:
  # Generated by sqlc from queries/*.sql. Covering it would mean writing tests
  # against a code generator's output rather than against our queries — and the
  # queries themselves are covered through the repository tests that use them.
  # `sqlc diff` in CI is what guards this code, not coverage.
  - "source/internal/repository/sqlite/*.sql.go"
  - "source/internal/repository/sqlite/db.go"
  - "source/internal/repository/sqlite/models.go"

  # The provider conformance suite. It is a test helper that happens to live in
  # a normal package so every driver's tests can call it, and most of its
  # branches are t.Errorf calls that execute ONLY when a driver is broken. A
  # green suite therefore cannot cover them, and making them coverable would
  # mean deliberately shipping a broken driver.
  - "source/internal/platform/provider/providertest"

coverage:
  status:
    project:
      default:
        # Small allowance for the noise inherent in comparing two profiles;
        # a real regression is far larger than this.
        threshold: 1%
    patch:
      default:
        threshold: 1%

comment:
  layout: "condensed_header, files, condensed_footer"
  require_changes: true
