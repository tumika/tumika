[package]
name = "tumika-desktop"
version = "0.1.0"
description = "tumika desktop app"
authors = ["tumika"]
edition = "2021"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name, which
# collide otherwise on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "tumika_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
# The updater verifies the archive it downloads against `plugins.updater.pubkey`
# in `tauri.conf.json`. `rustls-tls` keeps it on the same pure-Rust TLS stack as
# `reqwest` below; the default feature would link the platform one.
tauri-plugin-updater = { version = "2", default-features = false, features = [
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
thiserror = "2"
# `process` for the Keychain read: it is spawned on the runtime so a Keychain
# that does not answer occupies no worker, and dropping the timed-out read kills
# the child with it. `net` and `io-util` are the loopback socket the update
# decision is handed to the Tauri updater over.
tokio = { version = "1", features = ["io-util", "net", "process", "time"] }

# rustls rather than the platform TLS stack: it is pure Rust, so the app links
# no system crypto library and cross-building stays free of one.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# Pure Rust ECDSA P-256, for the signature over a bill of materials. `pem`
# reads the compiled-in public keys; nothing here signs, so no private-key
# feature is enabled.
p256 = { version = "0.14", default-features = false, features = [
    "ecdsa",
    "pem",
    "std",
] }

# The release label pattern is a copy of the daemon's Go regexp, so it is
# matched by a regexp engine of the same dialect rather than re-spelled by hand.
regex = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
