[package]
name = "tumika-desktop"
version = "0.1.0"
description = "tumika desktop app"
authors = ["tumika"]
edition = "2021"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name, which
# collide otherwise on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "tumika_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
thiserror = "2"
# `process` for the Keychain read: it is spawned on the runtime so a Keychain
# that does not answer occupies no worker, and dropping the timed-out read kills
# the child with it.
tokio = { version = "1", features = ["process", "time"] }

# rustls rather than the platform TLS stack: it is pure Rust, so the app links
# no system crypto library and cross-building stays free of one.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
