# goreleaser configuration for tumika.
#
# One binary, four targets. The two archive formats are not redundant:
#
#   - the tar.gz is what a person downloads
#   - the RAW binary is what `tumika update` fetches (ADR-0003)
#
# The self-updater replaces the running binary with an atomic rename, so it needs
# a single uncompressed file at a predictable URL — not an archive it would have
# to unpack into a temporary directory first. Removing the raw archive would
# break self-update silently, at the next release rather than at build time.
version: 2

before:
  hooks:
    # download, NOT tidy. `go mod tidy` rewrites go.mod and go.sum in place, so a
    # tagged tree that is not already tidy would be published as a binary built
    # against a different dependency set than the commit the release claims to
    # be — and the tag would no longer describe what was shipped.
    - sh -c "cd source/daemon && go mod download"

builds:
  - id: tumika
    dir: source/daemon
    main: ./cmd/tumika
    binary: tumika
    env:
      # The project invariant, stated here as well as in CI: modernc.org/sqlite
      # is pure Go precisely so every target links statically and the Pi build
      # is free.
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # All four, including darwin/amd64. tumika is a daemon someone may already
    # be running on an Intel Mac, and dropping a target is not something they
    # would discover until their self-update found no asset for their machine.
    flags:
      - -trimpath
    ldflags:
      # These four names are `main`'s own vars, not the buildinfo package's —
      # main.go calls buildinfo.Set with them. A typo here is silent: the binary
      # keeps the "dev" default, and `IsDev()` then disables self-update
      # entirely for the whole release.
      #
      # Neither of the two versions comes from the tag. release.yaml is the
      # single source of both, and the tag only says which release is being cut.
      #
      # main.version is the DAEMON COMPONENT's semver, read out of release.yaml
      # by scripts/release-component-version.sh into TUMIKA_DAEMON_VERSION. The
      # tag is a zero-padded CalVer label (v2026.09.01), which is not semver at
      # all, so a binary stamped from it could never be compared by the
      # updater's parseVersion. A missing TUMIKA_DAEMON_VERSION fails the build
      # with "map has no entry for key" — deliberately, because the fallback
      # would be a binary whose component version is a guess.
      #
      # main.release is the release LABEL, a different thing again: it comes
      # from TUMIKA_RELEASE, which the release workflow reads out of the same
      # file through scripts/release-label.sh — the only thing that validates it
      # against the shape the daemon accepts (release.ValidateReleaseLabel —
      # YYYY.MM.NN[-beta.N] or edge.N). The default is what a snapshot build
      # carries: left at "dev" the label reads as "no release", and the recency
      # half of the channel rules has nothing to compare against.
      - -s -w
      - -X main.version={{ .Env.TUMIKA_DAEMON_VERSION }}{{ if .IsSnapshot }}-snapshot{{ end }}
      - -X main.release={{ envOrDefault "TUMIKA_RELEASE" "dev" }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}

archives:
  # Every asset is named by the daemon COMPONENT version, never by {{ .Version }}
  # — which is the tag, and therefore the CalVer release label. The BOM
  # generator finds a release's assets by the prefix
  # `tumika_<component version>_`, and verify-release-assets.sh asserts the same
  # names; a label in the name would leave every release with no component
  # assets at all.
  - id: tumika
    ids:
      - tumika
    name_template: >-
      tumika_{{ .Env.TUMIKA_DAEMON_VERSION }}{{ if .IsSnapshot }}-snapshot{{ end }}_{{ .Os }}_{{ .Arch }}

  # Raw, uncompressed. This is the asset the BOM names, so it is what the
  # self-updater and scripts/install-daemon.sh both download — the name template
  # is what lets the generator find it.
  - id: raw
    ids:
      - tumika
    formats:
      - binary
    name_template: >-
      {{ .Binary }}_{{ .Env.TUMIKA_DAEMON_VERSION }}{{ if .IsSnapshot }}-snapshot{{ end }}_{{ .Os }}_{{ .Arch }}

checksum:
  # ONE checksums file covering both archives. The BOM generator reads each raw
  # asset's sha256 from it, so a release without it is skipped. It is not a
  # trust root: the signature on the published BOM is.
  name_template: checksums.txt

snapshot:
  # A snapshot names itself, off the same component version the assets carry, so
  # metadata.json and the asset names agree and verify-release-assets.sh can
  # tell a snapshot from a release without being told. Deriving it from the tag
  # instead would turn v2026.09.01 into 2026.9.2-snapshot — a bumped, unpadded
  # label masquerading as a component version.
  version_template: "{{ .Env.TUMIKA_DAEMON_VERSION }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: tumika
    name: tumika

  # The tag glob in release.yml is v*.*.*, which also matches a beta tag such as
  # v2026.09.01-beta.1. goreleaser publishes a full release by default, so a
  # beta would carry prerelease=false — and the BOM generator refuses a release
  # whose GitHub prerelease flag disagrees with the channel its tag names, which
  # would drop the beta off the site entirely. `auto` marks any tag carrying a
  # prerelease segment as one; the promote step sets the flag explicitly when it
  # makes the release public.
  prerelease: auto

  # Published as a DRAFT, then promoted by the workflow only after the assets
  # have been verified.
  #
  # Without this the verification runs after `release --clean` has already made
  # everything public: a missing raw asset or an untaken ldflag would turn the
  # workflow red while the broken release stayed downloadable. A gate that
  # reports rather than prevents is not a gate.
  draft: true
  # release.yaml is attached because it names the label and every component
  # version this release was built from: the gate reads the previously published
  # one to enforce that a component version only ever moves forward. The
  # installer is not a release asset — it is served from get.tumika.org, where a
  # first-time user has no release to download it from.
  extra_files:
    - glob: release.yaml
  header: |
    ## tumika

    A self-hostable personal assistant daemon. It runs deterministic workflows on
    a schedule, driving the vendored Claude Code CLI against a Claude
    subscription rather than the paid API.

    Statically linked, no cgo, no runtime dependencies.

    **Install**

    ```sh
    curl -fsSL https://get.tumika.org/install-daemon.sh | sh
    ```

    Then `sudo tumika install` to run it as a service — a systemd unit on Linux,
    a LaunchAgent on macOS.

    **Container**

    ```sh
    docker volume create tumika
    docker run --rm -v tumika:/var/lib/tumika ghcr.io/tumika/tumika:latest token rotate
    docker run -v tumika:/var/lib/tumika -p 127.0.0.1:8737:8737 \
      ghcr.io/tumika/tumika:latest serve --listen 0.0.0.0:8737
    ```
