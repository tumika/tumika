# ci-build — this file is yours.
#
# gt created it once and will never modify or delete it again.
#
# Everything that answers "does this tree build and is it internally
# consistent" — moved here verbatim from ci.yml, comments included.
#
# release-build lives here rather than in a cd-* stage on purpose: it proves
# goreleaser can still produce what the updater and installer expect, on every
# PR, which is a build property. Actually shipping is a separate concern.
name: ci-build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: source/daemon/go.sum

      - name: go vet
        working-directory: source/daemon
        run: go vet ./...

      # golangci-lint runs depguard, which is the mechanical enforcement of the
      # layering rules in agentic/rules/ and ADR-0004. A forbidden import fails
      # the build here rather than becoming a review argument.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: source/daemon

  sqlc:
    name: sqlc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: source/daemon/go.sum

      # Installed from source at a pinned version rather than via a third-party
      # setup action: one fewer action to trust, and the version that generated
      # the committed code is visible right here. Keep it in step with the
      # version stamped in the generated files' header.
      - name: install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      # Fails when the committed generated code disagrees with the queries or
      # the schema. That is what makes
      # agentic/rules/every-schema-change-ships-a-migration-and-regenerated-sqlc.md
      # mechanical rather than a habit — stale generated code otherwise fails at
      # the exact query, at runtime, on the one path nobody exercised.
      - name: sqlc diff
        working-directory: source/daemon
        run: sqlc diff

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: source/daemon/go.sum

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        working-directory: source/daemon
        run: go build ./...

      # Every leg, with this leg's GOOS/GOARCH: see the note above. CGO_ENABLED=1
      # so the cgo files are visible to `go list` at all.
      - name: no cgo
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        working-directory: source/daemon
        run: |
          cgo=$(go list -f '{{if .CgoFiles}}{{.ImportPath}}{{end}}' ./... | grep -v '^$' || true)
          if [ -n "$cgo" ]; then
            echo "these packages use cgo on ${GOOS}/${GOARCH}, which breaks the static build:" >&2
            echo "$cgo" >&2
            exit 1
          fi

  # The macOS tray app. It lives here rather than in a gt-owned workflow
  # because ci-orchestration.yml and dependabot.yml are rendered by
  # `gt repo sync`: a job added there is reverted by the next sync, and the
  # check disappears from ci-gate without anything failing.
  #
  # macos-latest is not a preference — Tauri links against WebKit and AppKit,
  # and the app is macOS-only by design, so there is no other runner that can
  # build it.
  desktop:
    name: desktop
    runs-on: macos-latest
    defaults:
      run:
        working-directory: source/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm before setup-node: `cache: pnpm` asks node to locate the pnpm
      # store, which only works once pnpm is on PATH.
      #
      # The pnpm version comes from the `packageManager` field of the app's
      # package.json, which Dependabot's npm ecosystem also updates. `uses:`
      # steps ignore `defaults.run.working-directory`, so the file is named.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: source/desktop/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.7.0"
          cache: pnpm
          cache-dependency-path: source/desktop/pnpm-lock.yaml

      # --frozen-lockfile fails rather than resolving: a lockfile that
      # disagrees with package.json means CI built something nobody committed.
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm eslint .

      - name: tsc
        run: pnpm tsc --noEmit

      - name: vitest
        run: pnpm vitest run

      # No toolchain argument: rustup reads source/desktop/rust-toolchain.toml,
      # which pins the channel and the clippy/rustfmt components. The version
      # lives in that file alone, so a bump does not have to be mirrored here.
      - name: install the pinned rust toolchain
        run: rustup toolchain install

      # The registry, the git checkouts and the build directory. Tauri pulls in
      # a large dependency graph, and a cold build on a macOS runner is the
      # slowest thing in this workflow by a wide margin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('source/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt
        working-directory: source/desktop/src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: source/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: source/desktop/src-tauri
        run: cargo test

      # --debug skips the release optimisation pass and, more to the point,
      # skips signing and notarization, which this repository does not do. It
      # still runs the whole bundle path, which is where a missing icon or a
      # malformed tauri.conf.json shows up.
      - name: tauri build
        run: pnpm tauri build --debug

  # The SHIPPED image (ADR: D9). The test-harness image is not built here: the
  # linux-install job below builds it from the same context and then actually
  # exercises it, so a second build could only fail in cases that one already
  # covers.
  #
  # verify-image.sh does more than build: an image that compiles and cannot run
  # the binary, write its volume as an unprivileged account, or answer the API
  # is an image nobody can use.

  release-build:
    name: release-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: source/daemon/go.sum

      # The daemon COMPONENT's semver, which .goreleaser.yml requires: it names
      # every asset and stamps -X main.version, and an absent value fails the
      # build with "map has no entry for key" rather than falling back to a
      # guess. Assigned before it is written, because under `bash -e` a failing
      # command substitution in an assignment fails the step while
      # `echo "X=$(script)" >> "$GITHUB_ENV"` keeps echo's exit status.
      #
      # TUMIKA_RELEASE is deliberately left unset. This is the unlabelled
      # snapshot path, and the verification below asserts the binary carries the
      # "dev" default — which is what catches -X main.release no longer reaching
      # the compiler, on every PR rather than at the next release.
      - name: the daemon component version
        run: |
          version=$(scripts/release-component-version.sh daemon)
          echo "TUMIKA_DAEMON_VERSION=$version" >> "$GITHUB_ENV"

      # release --snapshot, not build --snapshot: `build` produces no archives
      # and no checksums, which is most of what the next step verifies.
      # --skip=publish means nothing leaves the runner.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --config source/daemon/.goreleaser.yml --snapshot --skip=publish --clean

      # The names the BOM generator and `tumika update` depend on, and the
      # ldflags that decide whether self-update works at all. None of it is
      # checked by the compiler or by `goreleaser check`, and every failure would
      # surface at the next release rather than here.
      - name: the release ships what the updater and installer expect
        run: scripts/verify-release-assets.sh
