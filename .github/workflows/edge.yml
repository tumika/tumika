name: edge

# Cuts an edge build: one manual run, dispatched on main, building any branch,
# tag or commit named by the `ref` input.
#
#   gh workflow run edge.yml --ref main -f ref=<branch>
#
# Edge is the channel for trying a change on a real installation before it is a
# release. It is deliberately the cheapest thing in this repository to publish —
# no gate, no tests, no requirement that the commit ever reached main — because
# the point is to get a branch onto a machine, and the tests that matter for a
# branch already run on its pull request.
#
# What keeps that cheapness safe is that an edge build cannot be mistaken for a
# release:
#
#   - it tags itself edge-<run number>, which release.yml's v*.*.* glob can
#     never match, so publishing one never triggers the calendar release
#     workflow;
#   - its component version carries an -edge.<run number> suffix, so no client
#     comparing versions ever confuses it with the calendar release it was cut
#     from, and scripts/check-release-monotonic.sh ignores edge tags when it
#     looks for the previous release;
#   - only a daemon whose update.channel is `edge` is offered one, and the edge
#     channel is ordered by publication time alone — an edge build moving a
#     component version backwards is expected rather than refused.
#
# And the branch being built never gets near a write token. Dispatching a
# workflow runs the workflow FILE from the dispatched ref, so a run dispatched on
# a branch would be that branch's definition of every job below — including the
# permissions they ask for. This file is therefore dispatched on main, and takes
# the thing to build as an input instead. The work splits in four:
#
#   - `build` checks out `ref` and runs its scripts, its goreleaser config and
#     its Go code, holding `contents: read` and no credentials. It publishes
#     nothing; it uploads an artifact.
#   - `desktop` does the same for the macOS app, running the branch's pnpm
#     scripts, its build.rs and its beforeBuildCommand under `contents: read`.
#     It builds with the updater artifacts OFF and packs the bundle itself, so
#     the job that runs branch code holds no key of any kind.
#   - `sign` runs main's checkout, main's pinned Tauri CLI and the updater
#     signing key over the archives that job produced. It downloads them as data
#     and runs `tauri signer sign`, nothing else: the signature a daemon verifies
#     an app against is written by a job that executes no branch code.
#   - `publish` runs main's checkout with `contents: write`, treats both
#     artifacts strictly as data — it executes nothing out of them — and checks
#     every file name against scripts/edge-check-artifact.sh before
#     `gh release create` sees it.
#
# Without that split, a branch's `scripts/edge-version.sh` runs beside a token
# that may `gh release upload --clobber` over a published release's binary and
# checksums.txt, which publish-pages.yml then signs — and its `pnpm build` runs
# beside the one key every desktop update is verified against.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "branch, tag or commit SHA to build"
        required: true
        type: string

# Read-only at the top, elevated on the publish job alone: `contents: write` to
# create and promote the release — an edge build pushes no image — and
# `actions: write` to dispatch the site publish.
permissions:
  contents: read

# One edge run at a time. The group is not per-ref because every run is on main
# now; what it serialises is the prune, which two runs would otherwise race on.
# Never cancelled: a cancelled run leaves a draft release behind, which is the
# one state this workflow cannot clean up after itself.
concurrency:
  group: edge
  cancel-in-progress: false

jobs:
  # Everything below needs this job, so a run that is not main's own definition
  # of this file stops before it builds anything.
  #
  # It cannot prove more than that. A branch carrying its own edge.yml dispatched
  # on itself is a different workflow definition, which no check written here
  # runs inside of; repository write access is what governs that, not this job.
  # What this does buy is that the file people actually dispatch has one correct
  # form, and dispatching it any other way fails in a second with a message
  # saying so rather than building from a branch under main's name.
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - name: this workflow is dispatched on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "edge.yml is dispatched on main and builds the ref you name:" >&2
          echo "  gh workflow run edge.yml --ref main -f ref=<branch>" >&2
          exit 1

  build:
    name: build
    needs: guard
    runs-on: ubuntu-latest
    # No write permission and no credentials: everything this job runs comes
    # from the ref it was asked to build.
    permissions:
      contents: read
    outputs:
      # The commit that was built, which is what the publish job tags. Taken from
      # the checkout rather than from the input, so the release points at a
      # commit rather than at a branch name that may have moved since.
      built-sha: ${{ steps.built.outputs.sha }}
      daemon-version: ${{ steps.built.outputs.daemon-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The input is only ever handed to actions, never spliced into a
          # `run:` script, where a ref named `$(…)` would execute on the runner.
          ref: ${{ inputs.ref }}
          # goreleaser builds the changelog from the commit range since the
          # previous tag, so a shallow clone silently produces an empty one.
          fetch-depth: 0
          # This job runs the checked-out branch's own code. It has no business
          # holding a token it could push with.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: source/daemon/go.sum

      # The release LABEL for `-X main.release` and the daemon COMPONENT's
      # semver for `-X main.version` and every asset name, both derived from
      # release.yaml and the run number, and both validated by the same two
      # scripts the calendar release reads that file with.
      #
      # The script's output is two KEY=VALUE lines, so it is redirected whole:
      # the redirect keeps the script's exit status, where
      # `echo "X=$(script)" >> "$GITHUB_ENV"` would keep echo's and export an
      # empty value from a failed run.
      #
      # `--write release.yaml` rewrites the working copy so that every component
      # version in it carries the edge suffix. That file is uploaded with the
      # assets, and it is what the BOM generator and
      # scripts/verify-release-assets.sh both read the daemon component version
      # from — so the asset names, the file describing them and the binary's own
      # stamp all come from one value.
      - name: the edge release label and the daemon component version
        run: scripts/edge-version.sh --write release.yaml "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      # A LOCAL tag, never pushed. goreleaser wants a tag to build against, and
      # the real one is created by the publish job's `gh release create --target`
      # — which needs no git credentials and no code from this checkout. edge-<n>
      # is outside release.yml's v*.*.* glob by construction: an edge build must
      # never set the calendar release workflow running.
      - name: tag this commit locally
        run: git tag "edge-$GITHUB_RUN_NUMBER"

      - id: built
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "daemon-version=$TUMIKA_DAEMON_VERSION" >> "$GITHUB_OUTPUT"

      # Same build as a calendar release, with the same config: the two values
      # above are all .goreleaser.yml needs, and an edge binary must be built
      # exactly the way a released one is or it is not a preview of anything.
      #
      # GORELEASER_CURRENT_TAG names the tag rather than leaving goreleaser to
      # describe it from HEAD, which would find an older edge tag on a branch
      # whose own tag was just created.
      #
      # --skip=publish is what makes this job safe to run branch code in: no
      # token is passed and nothing is uploaded. --skip=validate is what the edge
      # build needs beyond that: the working tree carries the generated
      # release.yaml, which validate refuses as a dirty state, and validate also
      # expects the tag to be the semver-shaped latest one on HEAD. Neither check
      # is about the artefacts, and the two things they would protect — the
      # version stamped and the assets produced — are asserted directly by the
      # step below.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --config source/daemon/.goreleaser.yml --clean --skip=validate,publish
        env:
          GORELEASER_CURRENT_TAG: edge-${{ github.run_number }}

      # Run here, in the job that has the build: the script executes the native
      # binary to read back what the ldflags stamped into it, and the publish job
      # runs nothing out of the artifact. The script reads the expected version
      # out of release.yaml — the edge one written above — and TUMIKA_RELEASE out
      # of the environment.
      - name: the edge build ships what the updater expects
        run: scripts/verify-release-assets.sh

      # goreleaser leaves the raw binary in a per-target directory under the
      # name `tumika`; the ASSET name it would have uploaded it under lives in
      # artifacts.json, and `--skip=publish` means nothing ever renames it. The
      # archives and checksums.txt are at the dist root already, and release.yaml
      # is delivered by release.extra_files, which the skipped publish step is
      # the only thing that reads — so it is copied here too.
      #
      # This directory is exactly the release's asset list and nothing else. The
      # publish job asserts that independently, on what it downloads.
      - name: stage the release assets
        run: |
          mkdir edge-assets
          while IFS=$'\t' read -r name path; do
            cp "$path" "edge-assets/$name"
          done < <(jq -r '.[]
            | select(.type == "Binary" and .name != "tumika")
            | [.name, .path] | @tsv' dist/artifacts.json)

          cp dist/*.tar.gz dist/checksums.txt release.yaml edge-assets/
          ls -l edge-assets

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-assets
          path: edge-assets
          if-no-files-found: error
          # Long enough to look at a failed publish, short enough that build
          # outputs do not accumulate. The release is the durable copy.
          retention-days: 7

  # The macOS tray app, built from the ref for the same reason the daemon is: an
  # edge build that carried the app over would offer a daemon the app version
  # pairs with and no app to pair it to.
  #
  # `contents: read`, no credentials, and — unlike release.yml's desktop job — no
  # secret at all. This job runs the branch's pnpm scripts, its build.rs and its
  # beforeBuildCommand, so the updater artifacts are switched OFF and the archive
  # is packed here as plain data; the `sign` job below is what signs it.
  #
  # macos-latest is not a preference: Tauri links against WebKit and AppKit, and
  # both architectures are cross-compiled with `--target` on that one runner. No
  # APPLE_* variable is set either, so an edge app is ad-hoc signed exactly as a
  # release one is today.
  desktop:
    name: desktop (${{ matrix.target.platform }})
    needs: guard
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      # Neither leg is a preview of the other: the pair is what the build
      # publishes, and seeing both failures is worth more than stopping early.
      fail-fast: false
      matrix:
        target:
          - { triple: aarch64-apple-darwin, platform: darwin_arm64 }
          - { triple: x86_64-apple-darwin, platform: darwin_amd64 }
    env:
      TRIPLE: ${{ matrix.target.triple }}
      PLATFORM: ${{ matrix.target.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The input is only ever handed to actions, never spliced into a
          # `run:` script, where a ref named `$(…)` would execute on the runner.
          ref: ${{ inputs.ref }}
          # This job runs the checked-out branch's own code. It has no business
          # holding a token it could push with.
          persist-credentials: false

      # pnpm before setup-node: `cache: pnpm` asks node to locate the pnpm store,
      # which only works once pnpm is on PATH. The pnpm version comes from the
      # `packageManager` field of the app's package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: source/desktop/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.7.0"
          cache: pnpm
          cache-dependency-path: source/desktop/pnpm-lock.yaml

      # `--write release.yaml` suffixes every component version in the working
      # copy, and the desktop component's is then read back out of it — the same
      # file, through the same script, that the daemon's build job derives its
      # asset names from and that the BOM generator reads. The two KEY=VALUE lines
      # the script prints are the daemon's, which this job has no use for; the
      # redirect is to /dev/null rather than to $GITHUB_ENV, and it keeps the
      # script's exit status either way.
      #
      # Stamped, where release.yml's desktop job only checks: the four files that
      # each carry a copy of the version are committed carrying the CALENDAR one,
      # and an edge build's is that value plus the run number, which no commit can
      # hold. The app reports what the asset name says because of this step.
      - name: the edge desktop component version
        run: |
          scripts/edge-version.sh --write release.yaml "$GITHUB_RUN_NUMBER" >/dev/null
          version=$(scripts/release-component-version.sh desktop)
          echo "TUMIKA_DESKTOP_VERSION=$version" >> "$GITHUB_ENV"
          scripts/desktop-version.sh "$version"

      # --frozen-lockfile fails rather than resolving: a lockfile that disagrees
      # with package.json means the build is of something nobody committed.
      - name: pnpm install
        working-directory: source/desktop
        run: pnpm install --frozen-lockfile

      # No toolchain argument: rustup reads source/desktop/rust-toolchain.toml,
      # which pins the channel.
      - name: install the pinned rust toolchain
        working-directory: source/desktop
        run: |
          rustup toolchain install
          rustup target add "$TRIPLE"

      # A key prefix of its own, never one release.yml restores. This job builds
      # whatever branch it was handed, so the cache it writes is branch-controlled
      # input to every later build that reads it — and a release build must take
      # no input from a branch that never reached main.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/desktop/src-tauri/target
          key: cargo-edge-${{ runner.os }}-${{ matrix.target.triple }}-${{ hashFiles('source/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-edge-${{ runner.os }}-${{ matrix.target.triple }}-

      # createUpdaterArtifacts is committed ON, and is turned off here: producing
      # the updater archive is what makes Tauri want TAURI_SIGNING_PRIVATE_KEY,
      # and this job must not hold it. The bundle is packed by the step below and
      # signed by the job after it.
      - name: tauri build (ad-hoc signed, unsigned archive)
        working-directory: source/desktop
        run: |
          pnpm tauri build --target "$TRIPLE" \
            -c '{"bundle":{"createUpdaterArtifacts":false}}'

      # The same archive Tauri's updater bundler would have written: a gzip tar
      # whose single top-level entry is the .app, under the asset name the bill of
      # materials resolves the desktop component by. The updater replaces a bundle
      # with what this archive holds, so the layout is the contract and
      # scripts/verify-desktop-assets.sh is what asserts it.
      #
      # The bundle is located by glob and required to be the only one, so a
      # productName change is a failure here rather than an asset packed under a
      # name taken from a stale expectation. COPYFILE_DISABLE keeps macOS tar from
      # storing extended attributes as the `._` members Tauri's own archive
      # carries none of.
      - name: pack the app bundle under its asset name
        run: |
          bundle="source/desktop/src-tauri/target/$TRIPLE/release/bundle/macos"
          apps=("$bundle"/*.app)
          if [ "${#apps[@]}" -ne 1 ] || [ ! -d "${apps[0]}" ]; then
            echo "expected exactly one *.app under $bundle, found: ${apps[*]}" >&2
            exit 1
          fi
          app="${apps[0]##*/}"

          mkdir dist-desktop
          name="tumika-desktop_${TUMIKA_DESKTOP_VERSION}_${PLATFORM}.app.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "dist-desktop/$name" -C "$bundle" "$app"
          tar -tzf "dist-desktop/$name"
          ls -l dist-desktop

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-unsigned-${{ matrix.target.platform }}
          path: dist-desktop
          if-no-files-found: error
          # Long enough to look at a failed publish, short enough that build
          # outputs do not accumulate. The release is the durable copy.
          retention-days: 7

  # The updater signature over both archives, and the only job in this workflow
  # holding a key.
  #
  # It runs MAIN's checkout — the workflow's own ref, which `guard` has already
  # established is main — and main's pinned Tauri CLI, because the archives it
  # opens were produced by branch code. The two artifacts are downloaded strictly
  # as DATA: nothing in them is executed, unpacked or read as configuration, and
  # the only command run over them is `tauri signer sign`.
  #
  # `contents: read` and no token: a signature is not something this job
  # publishes. It hands the signed pair on as another artifact.
  sign:
    name: sign
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: source/desktop/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.7.0"
          cache: pnpm
          cache-dependency-path: source/desktop/pnpm-lock.yaml

      # The signer reads bytes and writes a signature, so this job needs no macOS
      # toolchain and no cargo: the pinned @tauri-apps/cli is the whole of it, and
      # the lockfile carries its Linux binary alongside the Darwin ones.
      - name: pnpm install
        working-directory: source/desktop
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-unsigned-*
          merge-multiple: true
          path: desktop-assets

      # TAURI_SIGNING_PRIVATE_KEY is the updater keypair's private half — the key
      # CONTENTS, not a path — and its public half is committed in
      # tauri.conf.json, which is what an installed app verifies a download
      # against. The CLI reads both variables from the environment, so neither
      # value reaches a command line.
      #
      # The PASSWORD variable is declared whether or not the key has one: with it
      # unset the CLI prompts, and a runner has no terminal to prompt at, so the
      # signing fails with a message about a password it was never going to be
      # given. An absent secret renders as the empty string, which is what a key
      # without a password wants.
      #
      # `tauri signer sign <file>` writes `<file>.sig` beside it — the base64 of
      # the minisign document, byte for byte what `tauri build` would have written
      # with createUpdaterArtifacts on, and what bomgen copies into the BOM's
      # `signature` field.
      - name: sign each archive with the updater key
        working-directory: source/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          archives=("$GITHUB_WORKSPACE"/desktop-assets/*.app.tar.gz)
          if [ "${#archives[@]}" -ne 2 ]; then
            echo "expected both legs' archives, found: ${archives[*]}" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            pnpm tauri signer sign "$archive"
          done
          ls -l "$GITHUB_WORKSPACE/desktop-assets"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-signed
          path: desktop-assets
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [build, sign]
    runs-on: ubuntu-latest
    # The only elevated job. It runs main's checkout and main's scripts, and
    # nothing from the ref that was built.
    permissions:
      contents: write
      actions: write
    env:
      # Named here rather than interpolated into any `run:` below: the input and
      # the build job's outputs are chosen by whoever dispatched the run, and a
      # value spliced into a script is a value that executes.
      BUILT_REF: ${{ inputs.ref }}
      BUILT_SHA: ${{ needs.build.outputs.built-sha }}
      DAEMON_VERSION: ${{ needs.build.outputs.daemon-version }}
    steps:
      # The default checkout: this workflow was dispatched on main, so this is
      # main at the commit the run started from. persist-credentials is off
      # because nothing here uses git to publish — `gh` authenticates with
      # GH_TOKEN.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edge-assets
          path: edge-assets

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-signed
          path: desktop-assets

      # From the release.yaml the build job staged, through main's own script: it
      # is the file the BOM generator resolves the desktop component's assets by,
      # so reading the name from anywhere else would verify names nothing else
      # looks for. The value is data — the script fails on anything that is not a
      # component version — and the check below anchors it to this run's number.
      - name: the desktop component version the built ref declares
        run: |
          version=$(scripts/release-component-version.sh desktop edge-assets/release.yaml)
          echo "TUMIKA_DESKTOP_VERSION=$version" >> "$GITHUB_ENV"

      # The digests, computed here from the very bytes about to be uploaded: the
      # BOM generator reads each asset's SHA-256 out of checksums.txt, which
      # goreleaser writes for the daemon's assets alone. A digest carried over from
      # the job that built the app would be a digest that job chose.
      #
      # The check reads the app's own Info.plist out of the archive, which is the
      # only thing that can say the component version reached tauri.conf.json. It
      # reads and never extracts onto the filesystem, which is what makes it safe
      # to run here on bytes a branch produced.
      - name: the desktop assets are what the bill of materials reads
        run: |
          scripts/verify-desktop-assets.sh --checksums \
            desktop-assets "$TUMIKA_DESKTOP_VERSION" > desktop-checksums.txt
          cat desktop-checksums.txt >> edge-assets/checksums.txt
          mv desktop-assets/* edge-assets/

      # Both artifacts are DATA. Nothing in them is executed, sourced or read as
      # configuration by this job; the only thing taken from them is a set of file
      # names, and that set is closed rather than filtered. The run number comes
      # from github.run_number, not from the artifact, so assets belonging to
      # another run cannot be published under this one's tag.
      - name: the artifact contains the release's assets and nothing else
        run: scripts/edge-check-artifact.sh edge-assets "$GITHUB_RUN_NUMBER"

      # The tag is created by the release, at the commit the build job reported.
      # A commit that is in the repository is a valid target whether or not it is
      # on a branch, so no git push and no credential on this runner is involved
      # in tagging the branch that was built.
      #
      # Created as a DRAFT: nothing is downloadable until the promote step below,
      # so a failure in between leaves a draft to delete rather than a broken
      # build people can install.
      - name: create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # shellcheck disable=SC2016 # the backticks are markdown in the release notes
          notes=$(printf 'Edge build of `%s` at `%s`.\n\nDaemon %s, desktop %s. Not a release: cut without the gate, from a commit that need never have reached main.\n' \
            "$BUILT_REF" "$BUILT_SHA" "$DAEMON_VERSION" "$TUMIKA_DESKTOP_VERSION")
          gh release create "edge-$GITHUB_RUN_NUMBER" \
            --draft \
            --prerelease \
            --target "$BUILT_SHA" \
            --title "edge-$GITHUB_RUN_NUMBER" \
            --notes "$notes" \
            edge-assets/*

      # Asked of GitHub rather than of the directory uploaded from: the check
      # above says what was sent, this says what arrived. The BOM generator skips
      # a release carrying no release.yaml or no checksums.txt asset, which would
      # leave this build published and invisible to every edge daemon.
      - name: the edge build carries the assets the site depends on
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=$(gh release view "edge-$GITHUB_RUN_NUMBER" --json assets --jq '.assets[].name')
          echo "$assets"
          for want in release.yaml checksums.txt; do
            grep -qx "$want" <<<"$assets" \
              || { echo "the release has no $want" >&2; exit 1; }
          done

      # Promoted only now, and as a prerelease: an edge build is never what
      # /releases/latest points at, and it is not a release anyone should reach
      # by browsing.
      - name: publish the edge build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "edge-$GITHUB_RUN_NUMBER" --draft=false --prerelease=true

      # Edge builds accumulate without limit otherwise, a build's worth of raw
      # binaries, archives and app bundles at a time. Pruned after the promote, so
      # this run's own build is among the ones kept. A pruned build's BOM
      # disappears with it, which a daemon still running it reads as "older than
      # the head" rather than as an error.
      - name: keep the newest five edge builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 200 \
            --json tagName,isDraft,createdAt \
            --jq '.[] | [.tagName, .isDraft, .createdAt] | @tsv' \
            | scripts/edge-prune.sh --delete

      # The site is published by publish-pages.yml run on main, not called from
      # here. A called workflow runs at the caller's commit; this run's commit is
      # main's, so calling it would work — but it would also mean that the day
      # this workflow is dispatched from anywhere else, the branch's own
      # tumika-bom source is what stands in front of the release signing key.
      # Dispatched on main, the signing job runs main's code under the
      # `release-signing` environment's branch policy. The generator reads the
      # published edge release from the API, so it needs nothing from the ref
      # that was built. GITHUB_TOKEN may dispatch a workflow even though it
      # raises no other workflow event.
      - name: publish the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run publish-pages.yml --ref main

      # An edge build is identified by the ref and commit it was cut from, which
      # is the one thing the tag and the version do not say. Written even when a
      # step above failed: a run that got as far as creating a release is one
      # somebody has to go and look at.
      - name: summary
        if: always()
        run: |
          {
            echo "## edge-$GITHUB_RUN_NUMBER"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| ref | \`$BUILT_REF\` |"
            echo "| commit | \`$BUILT_SHA\` |"
            echo "| daemon | \`$DAEMON_VERSION\` |"
            echo "| desktop | \`$TUMIKA_DESKTOP_VERSION\` |"
          } >> "$GITHUB_STEP_SUMMARY"
