name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: go vet
        run: go vet ./...

      # golangci-lint runs depguard, which is the mechanical enforcement of the
      # layering rules in .agents/rules/ and ADR-0004. A forbidden import fails
      # the build here rather than becoming a review argument.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  sqlc:
    name: sqlc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      # Installed from source at a pinned version rather than via a third-party
      # setup action: one fewer action to trust, and the version that generated
      # the committed code is visible right here. Keep it in step with the
      # version stamped in the generated files' header.
      - name: install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      # Fails when the committed generated code disagrees with the queries or
      # the schema. That is what makes
      # .agents/rules/every-schema-change-ships-a-migration-and-regenerated-sqlc.md
      # mechanical rather than a habit — stale generated code otherwise fails at
      # the exact query, at runtime, on the one path nobody exercised.
      - name: sqlc diff
        run: sqlc diff

  build-test:
    name: build & test
    # Both supported platforms, because a meaningful amount of this codebase is
    # platform-specific: the Keychain and systemd-creds sealing backends, the
    # launchd and systemd service drivers, and the PTY login flow. Testing only
    # on Linux would leave the macOS half of that unbuilt.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: go build
        run: go build ./...

      # -coverpkg=./... credits coverage across package boundaries.
      #
      # Without it a profile only records the package under test, so code
      # exercised by another package's tests reads as zero — the daemon's
      # end-to-end tests drive the API handlers and the service layer, and none
      # of it counted. That understated the real figure by about five points and
      # made the coverage gates argue with reality rather than with the code.
      - name: go test
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...

      # Only the Linux profile feeds the coverage gate, so the baseline is
      # measured the same way every time. Build-tagged files for the other
      # platform are simply absent from a profile rather than counted as
      # uncovered — the compiler never sees them — so this does not deflate the
      # number. It does mean the darwin-only code (the Keychain sealer, the
      # launchd driver) is tested on macOS but not coverage-gated; merging two
      # platforms' profiles correctly needs `go tool covdata`, which is worth
      # revisiting once those files exist.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage-out
          path: coverage.out
          retention-days: 1

  # Builds the DEPLOYMENT TARGET, which nothing else does: `build & test`
  # compiles for whatever the runner happens to be, and tumika is written for a
  # Raspberry Pi. A break in linux/arm64 would otherwise ship green.
  #
  # It also enforces the no-cgo invariant, which `.golangci.yml`'s nocgo rule
  # documents and cannot enforce — depguard never sees `import "C"` in either
  # cgo mode.
  #
  # Two things about that enforcement, each of which was got wrong first:
  #
  #  1. It is `go list`, not the build. `CGO_ENABLED=0 go build ./...` looks like
  #     it would catch a cgo package and does not — build constraints exclude
  #     the file, the pattern match skips the package, and the build exits zero.
  #  2. It runs on EVERY matrix leg, because `go list` applies build constraints
  #     for the current GOOS/GOARCH exactly as the build does. A
  #     `//go:build darwin` file importing "C" is invisible on the linux legs,
  #     so restricting this to one leg reopened precisely the hole it closes.
  #
  # Both verified by adding such a package and watching the check pass.
  #
  # Scope: this covers THIS MODULE's source. A dependency that uses cgo is
  # covered by the CGO_ENABLED=0 build above — if it has a pure-Go fallback the
  # build succeeds and the invariant holds, and if it does not the build fails.
  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: go build ./...

      # Every leg, with this leg's GOOS/GOARCH: see the note above. CGO_ENABLED=1
      # so the cgo files are visible to `go list` at all.
      - name: no cgo
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: |
          cgo=$(go list -f '{{if .CgoFiles}}{{.ImportPath}}{{end}}' ./... | grep -v '^$' || true)
          if [ -n "$cgo" ]; then
            echo "these packages use cgo on ${GOOS}/${GOARCH}, which breaks the static build:" >&2
            echo "$cgo" >&2
            exit 1
          fi

  # The SHIPPED image (ADR: D9). The test-harness image is not built here: the
  # linux-install job below builds it from the same context and then actually
  # exercises it, so a second build could only fail in cases that one already
  # covers.
  #
  # verify-image.sh does more than build: an image that compiles and cannot run
  # the binary, write its volume as an unprivileged account, or answer the API
  # is an image nobody can use.
  images:
    name: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: build and exercise the shipped image
        run: deploy/verify-image.sh

  # THE integration gate, and the one job allowed to be slow. It is what makes
  # the Pi deployment trustworthy without a Pi.
  #
  # Every assertion in verify.sh is there because it caught something that a
  # fully green unit-test suite did not: the service account, the ownership
  # handover, the unit systemd actually accepts, an upgrade that restarts onto
  # the new binary, a system install that does not use a per-user home, and a
  # crash loop that must not be reported as running.
  linux-install:
    name: linux-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: install under a real systemd
        run: deploy/testharness/verify.sh

  # `goreleaser build --snapshot` on every PR, so the release configuration is
  # exercised continuously rather than first tried on a tag — the one moment
  # when a broken build is most expensive and least expected.
  #
  # --snapshot builds without a tag and publishes nothing.
  release-build:
    name: release-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      # release --snapshot, not build --snapshot: `build` produces no archives
      # and no checksums, which is most of what the next step verifies.
      # --skip=publish means nothing leaves the runner.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --snapshot --skip=publish --clean

      # The names install.sh and `tumika update` depend on, and the ldflags that
      # decide whether self-update works at all. None of it is checked by the
      # compiler or by `goreleaser check`, and every failure would surface at the
      # next release rather than here.
      - name: the release ships what the updater and installer expect
        run: scripts/verify-release-assets.sh

  bulwark:
    name: bulwark
    # Fail fast: bulwark's coverage step parses the profile build-test produced,
    # so a broken build would fail it the same way — but only after installing
    # gosec/govulncheck/semgrep first. No point paying that on a tree we already
    # know is red.
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write       # bulwark coverage caches baselines on the bulwark-state branch
      pull-requests: write  # for the PR summary comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # bulwark needs full history to resolve the PR's base commit

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      # build-test's `go test -race -coverprofile=coverage.out ./...` is the only
      # place tests run — downloading its output here instead of having bulwark
      # coverage execute the suite a second time under --tests=run.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-out

      # Every third-party action above is SHA-pinned, because a tag they own can
      # be silently repointed at code we never reviewed. bulwark is ours: the
      # floating `v1` major alias is its intended delivery channel, moved
      # deliberately on each release so consumers pick up scanner fixes without a
      # bump PR each time. Pinning it would trade that for nothing — the
      # supply-chain risk the rule guards against is the same risk we'd be taking
      # on our own repo either way.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: wardnet/bulwark@v1
        with:
          # No coverage inputs: bulwark v1.7.0 removed tests-mode/go-report in
          # favour of `coverage.source` in .bulwark.yml at the scan root. The
          # artifact above lands coverage.out at that root, which is the first
          # path bulwark's own candidate search checks, so no override is needed.
          # With a Semgrep token bulwark runs `semgrep ci` — Semgrep's own
          # diff-aware mode — instead of `semgrep scan`, and reports to the
          # AppSec Platform dashboard. GitHub withholds secrets from Dependabot
          # events, so those PRs fall back to the token-less path; bulwark scopes
          # that one to the PR's diff itself, which is what the `fetch-depth: 0`
          # above is for.
          semgrep-app-token: ${{ secrets.SEMGREP_APP_TOKEN }}
          # Codecov is dashboard and history only, and is non-blocking. The
          # pass/fail coverage gate is `bulwark coverage` itself.
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  # The single job the branch-protection ruleset actually requires. Individual
  # job names are an implementation detail that changes as CI evolves —
  # pointing the ruleset at each one means every job rename/add/remove is
  # also a ruleset edit, and a job left off the required list can fail
  # silently without blocking a merge. Add a job to `needs:` below and the
  # gate covers it automatically; the ruleset itself never needs to change.
  #
  pr-gate:
    name: PR Gate
    if: always()
    needs: [lint, sqlc, build-test, cross-compile, release-build, images, linux-install, bulwark]
    runs-on: ubuntu-latest
    steps:
      - name: Require all upstream jobs to have succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*|*skipped*)
              echo "one or more required jobs did not succeed" >&2
              exit 1
              ;;
          esac
