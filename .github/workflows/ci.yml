name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: go vet
        run: go vet ./...

      # golangci-lint runs depguard, which is the mechanical enforcement of the
      # layering rules in .agents/rules/ and ADR-0004. A forbidden import fails
      # the build here rather than becoming a review argument.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  build-test:
    name: build & test
    # Both supported platforms, because a meaningful amount of this codebase is
    # platform-specific: the Keychain and systemd-creds sealing backends, the
    # launchd and systemd service drivers, and the PTY login flow. Testing only
    # on Linux would leave the macOS half of that unbuilt.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      # Only the Linux profile feeds the coverage gate, so the baseline is
      # measured the same way every time. Build-tagged files for the other
      # platform are simply absent from a profile rather than counted as
      # uncovered — the compiler never sees them — so this does not deflate the
      # number. It does mean the darwin-only code (the Keychain sealer, the
      # launchd driver) is tested on macOS but not coverage-gated; merging two
      # platforms' profiles correctly needs `go tool covdata`, which is worth
      # revisiting once those files exist.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage-out
          path: coverage.out
          retention-days: 1

  bulwark:
    name: bulwark
    # Fail fast: bulwark's coverage step parses the profile build-test produced,
    # so a broken build would fail it the same way — but only after installing
    # gosec/govulncheck/semgrep first. No point paying that on a tree we already
    # know is red.
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write       # bulwark coverage caches baselines on the bulwark-state branch
      pull-requests: write  # for the PR summary comment
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0    # bulwark needs full history to resolve the PR's base commit

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true

      # build-test's `go test -race -coverprofile=coverage.out ./...` is the only
      # place tests run — downloading its output here instead of having bulwark
      # coverage execute the suite a second time under --tests=run.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-out

      # Every third-party action above is SHA-pinned, because a tag they own can
      # be silently repointed at code we never reviewed. bulwark is ours: the
      # floating `v1` major alias is its intended delivery channel, moved
      # deliberately on each release so consumers pick up scanner fixes without a
      # bump PR each time. Pinning it would trade that for nothing — the
      # supply-chain risk the rule guards against is the same risk we'd be taking
      # on our own repo either way.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: wardnet/bulwark@v1
        with:
          tests-mode: skip
          go-report: coverage.out

  # The single job the branch-protection ruleset actually requires. Individual
  # job names are an implementation detail that changes as CI evolves —
  # pointing the ruleset at each one means every job rename/add/remove is
  # also a ruleset edit, and a job left off the required list can fail
  # silently without blocking a merge. Add a job to `needs:` below and the
  # gate covers it automatically; the ruleset itself never needs to change.
  #
  # Jobs still to join this list as the capabilities they test arrive:
  #   sqlc          — `sqlc diff`, with persistence
  #   build         — `goreleaser build --snapshot --clean`, with .goreleaser.yml
  #   images        — shipped image + systemd test-harness image
  #   linux-install — the integration gate that makes the Pi deployment
  #                   trustworthy without a Pi
  pr-gate:
    name: PR Gate
    if: always()
    needs: [lint, build-test, bulwark]
    runs-on: ubuntu-latest
    steps:
      - name: Require all upstream jobs to have succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*|*skipped*)
              echo "one or more required jobs did not succeed" >&2
              exit 1
              ;;
          esac
