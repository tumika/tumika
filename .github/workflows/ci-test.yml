# ci-test — this file is yours.
#
# gt created it once and will never modify or delete it again.
#
# The Linux coverage profile is uploaded as `gt-coverage`, which the bulwark
# stage consumes instead of running the suite a second time. That replaces the
# bulwark job this repository used to run itself.
name: ci-test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    name: build & test
    # Both supported platforms, because a meaningful amount of this codebase is
    # platform-specific: the Keychain and systemd-creds sealing backends, the
    # launchd and systemd service drivers, and the PTY login flow. Testing only
    # on Linux would leave the macOS half of that unbuilt.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      # Only the Linux profile feeds the coverage gate, so the baseline is
      # measured the same way every time. Build-tagged files for the other
      # platform are simply absent from a profile rather than counted as
      # uncovered — the compiler never sees them — so this does not deflate the
      # number. It does mean the darwin-only code (the Keychain sealer, the
      # launchd driver) is tested on macOS but not coverage-gated; merging two
      # platforms' profiles correctly needs `go tool covdata`, which is worth
      # revisiting once those files exist.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-latest'
        with:
          name: gt-coverage
          path: coverage.out
          retention-days: 1
